<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>parallax.js comparison harness</title>
  <style>
    body { margin: 0; font: 14px sans-serif; }
    .section { height: 300px; margin: 0 0 400px; position: relative; }
    .spacer { height: 600px; }
    #container { position: relative; }
  </style>
</head>
<body>
<div id="stage"></div>
<script>
  // ?impl=original|vanilla &jq=1|3|4|none &case=name &file=parallax.js
  var params = new URLSearchParams(location.search);
  window.IMPL = params.get('impl') || 'vanilla';
  window.JQ = params.get('jq') || '3';
  window.CASE = params.get('case');
  var scripts = ['/repo/test/cases.js'];
  if (JQ !== 'none') { scripts.push('/vendor/jquery-' + JQ + '.js'); }
  scripts.push(IMPL === 'original' ? '/repo/test/original/parallax-1.5.0.js' : '/repo/' + (params.get('file') || 'parallax.js'));
  if (IMPL !== 'original') { scripts.push('/repo/test/api-tests.js'); }
  (function next() {
    var src = scripts.shift();
    if (!src) { window.READY = true; return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () {
      // Build the case markup before the plugin loads, so the data API
      // (data-parallax="scroll") sees it.
      if (src === '/repo/test/cases.js' && window.CASE) { T.markup(window.CASE); }
      next();
    };
    s.onerror = function () { window.LOAD_ERROR = src; };
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
